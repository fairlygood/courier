<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .login { max-width: 360px; margin: 80px auto; }
    .login label { display: block; font-size: 14px; font-weight: 600; color: #666; margin-bottom: 6px; }
    .login input { width: 100%; padding: 10px 14px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
    .login button { width: 100%; padding: 10px 0; font-size: 16px; font-weight: 600; background: #333; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .login .error { color: #c00; font-size: 14px; margin-top: 8px; }

    .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
    .tab { padding: 10px 24px; font-size: 15px; font-weight: 600; cursor: pointer; color: #888; border: none; background: none; }
    .tab.active { color: #333; border-bottom: 2px solid #333; margin-bottom: -2px; }

    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    th, td { padding: 10px 14px; text-align: left; font-size: 14px; }
    th { background: #fafafa; font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { border-top: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }

    .del-btn { padding: 4px 12px; font-size: 12px; font-weight: 600; color: #c00; background: #fff; border: 1px solid #fcc; border-radius: 6px; cursor: pointer; }
    .del-btn:hover { background: #c00; color: #fff; border-color: #c00; }

    .confirm-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box {
      background: #fff; border-radius: 12px; padding: 28px; max-width: 400px; width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .confirm-box p { margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
    .confirm-box .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .confirm-box .cancel { padding: 8px 18px; font-size: 14px; background: #eee; border: none; border-radius: 8px; cursor: pointer; }
    .confirm-box .confirm { padding: 8px 18px; font-size: 14px; font-weight: 600; color: #fff; background: #c00; border: none; border-radius: 8px; cursor: pointer; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 10px 20px;
      background: #333; color: #fff; border-radius: 8px; font-size: 14px;
      opacity: 0; transform: translateY(10px); transition: all 0.2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .empty { text-align: center; padding: 40px; color: #999; font-size: 15px; }
    .logout { float: right; font-size: 13px; color: #888; cursor: pointer; background: none; border: none; margin-top: 4px; }
    .logout:hover { color: #333; }

    .meta { font-size: 12px; color: #999; }
    .desc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .letter-row { cursor: pointer; }

    .viewer-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 99; overflow-y: auto; padding: 40px 20px;
    }
    .viewer-overlay.show { display: block; }
    .viewer-content {
      max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px;
      padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .viewer-header h2 { font-size: 18px; }
    .viewer-close { font-size: 22px; cursor: pointer; background: none; border: none; color: #666; padding: 4px 8px; }
    .viewer-close:hover { color: #333; }
    .viewer-meta { font-size: 13px; color: #888; margin-bottom: 20px; }
    .viewer-pages { display: flex; flex-direction: column; gap: 16px; }
    .viewer-pages img { width: 100%; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .viewer-loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login" class="login">
  <h1>Courier Admin</h1>
  <label for="password">Admin password</label>
  <input type="password" id="password" placeholder="Paste password from server logs">
  <button id="loginBtn">Sign in</button>
  <div id="loginError" class="error"></div>
</div>

<!-- Dashboard (hidden until login) -->
<div id="dashboard" style="display:none">
  <button class="logout" id="logoutBtn">Sign out</button>
  <h1>Courier Admin</h1>

  <div class="tabs">
    <button class="tab active" data-tab="letters">Letters</button>
    <button class="tab" data-tab="users">Users</button>
  </div>

  <div id="tab-letters"></div>
  <div id="tab-users" style="display:none"></div>
</div>

<!-- Letter viewer -->
<div id="viewerOverlay" class="viewer-overlay">
  <div class="viewer-content">
    <div class="viewer-header">
      <h2 id="viewerTitle"></h2>
      <button class="viewer-close" id="viewerClose">&times;</button>
    </div>
    <div class="viewer-meta" id="viewerMeta"></div>
    <div class="viewer-pages" id="viewerPages"></div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="actions">
      <button class="cancel" id="confirmCancel">Cancel</button>
      <button class="confirm" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
const API = '';

function token() {
  return sessionStorage.getItem('courier_admin_token');
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + token(),
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401 || res.status === 403) {
    sessionStorage.removeItem('courier_admin_token');
    showLogin();
    throw new Error('Auth failed');
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || res.statusText);
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) return res.json();
  return res;
}

// Login flow
function showLogin() {
  document.getElementById('login').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}
function showDashboard() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadLetters();
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('password').value;
  if (!pw) return;

  // Test the password against any admin endpoint
  try {
    const res = await fetch(API + '/api/admin/letters', {
      headers: { 'Authorization': 'Bearer ' + pw },
    });
    if (!res.ok) throw new Error('Invalid password');
    sessionStorage.setItem('courier_admin_token', pw);
    document.getElementById('loginError').textContent = '';
    document.getElementById('password').value = '';
    showDashboard();
  } catch {
    document.getElementById('loginError').textContent = 'Invalid password';
  }
});

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('courier_admin_token');
  showLogin();
});

if (token()) {
  // Verify the stored token still works
  fetch(API + '/api/admin/letters', {
    headers: { 'Authorization': 'Bearer ' + token() },
  }).then(r => {
    if (r.ok) showDashboard();
    else showLogin();
  }).catch(() => showLogin());
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('tab-letters').style.display = name === 'letters' ? 'block' : 'none';
    document.getElementById('tab-users').style.display = name === 'users' ? 'block' : 'none';
    if (name === 'letters') loadLetters();
    if (name === 'users') loadUsers();
  });
});

// Toast
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Confirm
let confirmResolve = null;
function confirm(msg) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOverlay').classList.add('show');
  });
}
document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmResolve?.(false);
});
document.getElementById('confirmOk').addEventListener('click', () => {
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmResolve?.(true);
});

// Letters
async function loadLetters() {
  const el = document.getElementById('tab-letters');
  try {
    const letters = await api('/api/admin/letters');
    if (letters.length === 0) {
      el.innerHTML = '<div class="empty">No letters yet.</div>';
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr>
          <th>Author</th><th>Description</th><th>Pages</th><th>Date</th><th></th>
        </tr></thead>
        <tbody>
          ${letters.map(l => `
            <tr class="letter-row" data-view-letter="${l.id}">
              <td><strong>${esc(l.authorUsername)}</strong><br><span class="meta">${esc(l.authorName)}</span></td>
              <td><span class="desc" title="${esc(l.description)}">${esc(l.description || '—')}</span></td>
              <td>${l.pageCount}</td>
              <td class="meta">${fmtDate(l.createdAt)}</td>
              <td><button class="del-btn" data-delete-letter="${l.id}">Delete</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-delete-letter]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.deleteLetter;
        const ok = await confirm('Delete this letter? This cannot be undone.');
        if (!ok) return;
        try {
          await api('/api/admin/letters/' + id, { method: 'DELETE' });
          toast('Letter deleted');
          loadLetters();
        } catch (err) {
          toast('Error: ' + err.message);
        }
      });
    });
    el.querySelectorAll('[data-view-letter]').forEach(row => {
      row.addEventListener('click', () => viewLetter(row.dataset.viewLetter));
    });
  } catch (err) {
    el.innerHTML = '<div class="empty">Failed to load letters: ' + esc(err.message) + '</div>';
  }
}

// Users
async function loadUsers() {
  const el = document.getElementById('tab-users');
  try {
    const users = await api('/api/admin/users');
    if (users.length === 0) {
      el.innerHTML = '<div class="empty">No users yet.</div>';
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr>
          <th>Username</th><th>Display name</th><th>Letters</th><th>Joined</th><th></th>
        </tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td><strong>${esc(u.username)}</strong></td>
              <td>${esc(u.displayName || '—')}</td>
              <td>${u.letterCount}</td>
              <td class="meta">${fmtDate(u.createdAt)}</td>
              <td><button class="del-btn" data-delete-user="${u.id}">Delete</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-delete-user]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.deleteUser;
        const ok = await confirm('Delete this user and all their letters? This cannot be undone.');
        if (!ok) return;
        try {
          await api('/api/admin/users/' + id, { method: 'DELETE' });
          toast('User deleted');
          loadUsers();
        } catch (err) {
          toast('Error: ' + err.message);
        }
      });
    });
  } catch (err) {
    el.innerHTML = '<div class="empty">Failed to load users: ' + esc(err.message) + '</div>';
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

// Letter viewer
async function viewLetter(id) {
  const overlay = document.getElementById('viewerOverlay');
  const title = document.getElementById('viewerTitle');
  const meta = document.getElementById('viewerMeta');
  const pages = document.getElementById('viewerPages');

  overlay.classList.add('show');
  title.textContent = 'Loading...';
  meta.textContent = '';
  pages.innerHTML = '<div class="viewer-loading">Loading letter...</div>';

  try {
    const letter = await api('/api/admin/letters/' + id);
    title.textContent = letter.authorUsername + ' — ' + (letter.description || 'No description');
    meta.textContent = letter.authorName + ' · ' + letter.pageCount + ' page' + (letter.pageCount !== 1 ? 's' : '') + ' · ' + fmtDate(letter.createdAt);

    if (letter.pageCount === 0) {
      pages.innerHTML = '<div class="viewer-loading">No pages.</div>';
      return;
    }

    pages.innerHTML = '';
    for (let i = 0; i < letter.pageCount; i++) {
      const img = document.createElement('img');
      img.alt = 'Page ' + (i + 1);
      pages.appendChild(img);
      // Fetch image with auth header, then set src to blob URL
      fetch('/api/admin/letters/' + id + '/page/' + i, {
        headers: { 'Authorization': 'Bearer ' + token() },
      }).then(res => res.blob()).then(blob => {
        img.src = URL.createObjectURL(blob);
      });
    }
  } catch (err) {
    pages.innerHTML = '<div class="viewer-loading">Failed to load: ' + esc(err.message) + '</div>';
  }
}

document.getElementById('viewerClose').addEventListener('click', () => {
  document.getElementById('viewerOverlay').classList.remove('show');
});
document.getElementById('viewerOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('viewerOverlay').classList.remove('show');
});
</script>

</body>
</html>
